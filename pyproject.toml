[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-brain"
version = "0.12.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "mcp>=2,<3",
  "jsonschema>=4.20,<5",
  "pyyaml>=6,<7",
  "packaging>=23",
  "pyflakes>=3,<4",
  "pillow>=10.1,<13",
  "pypdfium2>=4.30,<6",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "playwright>=1.45,<2",
]

[project.scripts]
codingbrain = "brain.local.cli:main"

[project.optional-dependencies]
claude = ["anthropic>=1.12,<2"]
tools = ["ast-grep-cli>=0.30,<1"]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<10", "anthropic>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
brain = ["data/*.json", "data/*.js", "local/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
