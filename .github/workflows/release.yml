name: Release (owner-approved)

# Publishes one verified commit of main as a release, only after the repository owner approves the
# `production` deployment. Started by hand (Actions > Release (owner-approved) > Run workflow, or
# the API) with the exact commit SHA and version:
#   1. gate     (read-only)  scripts/release_gate.py: commit on main, version and changelog match,
#                            tag absent, newer than the latest release, CI green on this exact
#                            code, and `production` requires a reviewer. Any failure stops here.
#   2. publish  (production) waits for the owner's approval, then builds from that commit, checks
#                            it built that commit, attests provenance, creates tag v<version> on it
#                            and publishes the release with SHA256SUMS.
#   3. confirm  (read-only)  downloads the published release and verifies every checksum, the
#                            version and that the tag points at the approved commit.
# The tag-push release path in windows-local-install.yml is unchanged and still works.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA on main to release"
        required: true
      version:
        description: "The version in pyproject.toml at that commit, e.g. 0.9.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the gate itself always runs from main, never from the candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --disable-pip-version-check -q packaging
          git fetch -q origin main
          python scripts/release_gate.py --sha "$SHA" --version "$VERSION" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: gate
    runs-on: windows-latest
    environment: production  # pauses here until the owner approves this deployment
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release assets from the approved commit
        shell: pwsh
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:SHA) { throw "Checked out $head, expected $env:SHA" }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne $env:VERSION) { throw "pyproject.toml says $version, expected $env:VERSION" }
          python scripts/build_release.py --out dist/release
      - name: Package matching desktop installer when desktop source is present
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if (-not (Test-Path 'desktop_ui/launch_native.py')) {
            Write-Host 'This approved historical commit contains engine-only source.'
            exit 0
          }
          if (-not (Test-Path 'desktop_ui/Update-CodingBrain.ps1')) {
            throw 'Desktop source has no verified dual-component updater: refuse to publish an incomplete GUI.'
          }
          python -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { throw 'Engine dependency installation failed' }
          python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'pywebview>=5,<7' 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build dependency installation failed' }
          python -m pytest -q -p no:cacheprovider tests/test_unified_windows_update.py tests/test_desktop_git_live.py tests/test_desktop_ui.py tests/test_desktop_native.py tests/test_desktop_management.py tests/test_desktop_engine_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop compatibility tests failed' }
          python -m pytest -q tests/test_desktop_installer_shutdown.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer shutdown tests failed' }
          # The binary carries the exact version of the engine release used to build it.
          $env:CODINGBRAIN_DESKTOP_VERSION = $env:VERSION
          python -c "import json,os,pathlib;pathlib.Path('desktop_ui/release-version.json').write_text(json.dumps({'version':os.environ['CODINGBRAIN_DESKTOP_VERSION']}),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop version metadata was not generated' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CodingBrainDesktop --collect-all webview --add-data 'desktop_ui;desktop_ui' desktop_ui/launch_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop packaging failed' }
          $app = (Resolve-Path 'dist/CodingBrainDesktop/CodingBrainDesktop.exe').Path
          $probe = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($probe.ExitCode -ne 0) { throw "Packaged desktop self-test failed: $($probe.ExitCode)" }
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
                    'C:\Program Files\Inno Setup 6\ISCC.exe') |
                    Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
            $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
                      'C:\Program Files\Inno Setup 6\ISCC.exe') |
                      Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler missing' }
          & $iscc "/DCodingBrainVersion=$env:VERSION" 'installer/windows/CodingBrainDesktop.iss'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/CodingBrain-Setup.exe')) {
            throw 'Versioned desktop installer failed to build'
          }
          # Test a real install and self-test before this installer can be published.
          $dir = Join-Path $env:RUNNER_TEMP 'CodingBrain-ReleaseInstallerTest'
          $installer = (Resolve-Path 'dist/CodingBrain-Setup.exe').Path
          $installed = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR=' + $dir)) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Desktop installation failed: $($installed.ExitCode)" }
          $exe = Join-Path $dir 'CodingBrainDesktop.exe'
          $selfTest = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { throw "Installed desktop self-test failed: $($selfTest.ExitCode)" }
          $uninstaller = Join-Path $dir 'unins000.exe'
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Desktop uninstall test failed' }
          Compress-Archive -Path 'dist/CodingBrainDesktop' -DestinationPath 'dist/CodingBrainDesktop-Windows.zip'
          python scripts/finalize_desktop_release.py --out dist/release --installer dist/CodingBrain-Setup.exe --portable dist/CodingBrainDesktop-Windows.zip
          if ($LASTEXITCODE -ne 0) { throw 'Matching desktop release manifest and checksums failed' }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*.whl
      - name: Tag the approved commit and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:SHA -m "Coding Brain $env:VERSION (owner-approved release of $env:SHA)"
          git push origin "refs/tags/$tag"
          $info = Get-Content -Raw dist/release/release.json | ConvertFrom-Json
          Set-Content -Path notes.md -Value $info.notes
          $flags = @()
          if ($info.channel -eq 'dev') { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release create $tag (Get-ChildItem dist/release -File).FullName --title "Coding Brain $($info.version)" --notes-file notes.md --verify-tag @flags

  confirm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir published && cd published
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY"
          sha256sum --check --strict SHA256SUMS
          test "$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')" = "$VERSION"
          test -f "coding_brain-$VERSION-py3-none-any.whl"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION")
          object=$(echo "$ref" | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])')
          kind=$(echo "$ref" | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["type"])')
          if [ "$kind" = tag ]; then
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .object.sha)
          fi
          test "$object" = "$SHA"
          echo "v$VERSION is published, its checksums verify, and it points at $SHA." | tee -a "$GITHUB_STEP_SUMMARY"
