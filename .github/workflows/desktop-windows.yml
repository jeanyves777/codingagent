name: Coding Brain native desktop (Windows)

on:
  pull_request:
    paths:
      - 'desktop_ui/**'
      - 'tests/test_desktop_git_live.py'
      - 'tests/test_unified_windows_update.py'
      - 'scripts/finalize_desktop_release.py'
      - '.github/workflows/release.yml'
      - 'tests/test_desktop_ui.py'
      - 'tests/test_desktop_native.py'
      - 'tests/test_desktop_management.py'
      - 'tests/test_desktop_engine.py'
      - 'brain/local/engine.py'
      - 'brain/local/assistant.py'
      - 'scripts/engine_client_check.py'
      - 'tests/test_desktop_engine_status.py'
      - 'tests/test_desktop_cli_discovery.py'
      - 'tests/test_desktop_legacy_engine.py'
      - 'brain/local/system.py'
      - 'tests/smoke_engine_status_browser.py'
      - 'tests/smoke_browser.py'
      - 'tests/smoke_git_browser.py'
      - 'tests/smoke_loading_browser.py'
      - 'tests/smoke_chat_gate_browser.py'
      - 'tests/smoke_confirm_browser.py'
      - 'tests/smoke_provider_browser.py'
      - 'tests/smoke_live_flow_browser.py'
      - 'tests/test_desktop_live.py'
      - 'tests/test_desktop_editor.py'
      - 'tests/smoke_editor_browser.py'
      - 'tests/smoke_stream_browser.py'
      - 'tests/smoke_conversation_browser.py'
      - 'tests/smoke_display_browser.py'
      - 'scripts/fetch_monaco.py'
      - 'brain/local/assistant.py'
      - 'tests/test_desktop_engine_installer_probe.py'
      - 'docs/backend-integration-handoff.md'
      - 'Start-CodingBrainDesktop.ps1'
      - 'installer/windows/CodingBrainDesktop.iss'
      - 'installer/windows/Setup-CodingBrain.ps1'
      - 'scripts/build_release.py'
      - 'installer/windows/Install-CodingBrainDesktop.ps1'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  # Only the newest candidate of a PR consumes runners; preserve all main/tag
  # verification, which the protected release gate may require at an exact SHA.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'pywebview>=5,<7' 'pyinstaller>=6,<7'
      - name: Native service, task approvals and browser API tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_desktop_ui.py tests/test_desktop_native.py tests/test_desktop_management.py tests/test_desktop_engine.py tests/test_desktop_engine_status.py tests/test_desktop_cli_discovery.py tests/test_cli_discovery.py tests/test_unified_windows_update.py tests/test_desktop_git_live.py tests/test_desktop_live.py tests/test_desktop_engine_installer_probe.py tests/test_desktop_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop_ui/static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real published v0.9.0 engine (the owner's installed version) behind the desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The owner's screenshot: 'CHECK IS ANY PROJECT EXIST' in New project mode on v0.9.0 must be
          # refused before any job (no brain.local.create, no task, nothing created). Chat and run too.
          gh release download v0.9.0 --repo "${{ github.repository }}" --dir legacy-dist
          python -m venv legacy-engine
          $pins = if (Test-Path legacy-dist\constraints.txt) { @('-c', 'legacy-dist\constraints.txt') } else { @() }
          legacy-engine\Scripts\python -m pip install --disable-pip-version-check -q @pins (Get-ChildItem legacy-dist\*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          legacy-engine\Scripts\codingbrain.exe version
          $env:CODINGBRAIN_LEGACY_ENGINE = (Resolve-Path legacy-engine\Scripts\codingbrain.exe).Path
          python -m pytest -q -rs tests/test_desktop_legacy_engine.py 2>&1 | Tee-Object -Variable legacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($legacy | Out-String) -notmatch '1 passed' -or ($legacy | Out-String) -match 'skipped') { throw 'the v0.9.0 acceptance did not run' }
      - name: Build genuine Windows desktop executable
        shell: pwsh
        run: |
          python scripts/fetch_monaco.py
          if ($LASTEXITCODE -ne 0) { throw 'Monaco editor fetch failed (pinned checksum)' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CodingBrainDesktop --collect-all webview --add-data 'desktop_ui;desktop_ui' desktop_ui/launch_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/CodingBrainDesktop/CodingBrainDesktop.exe)) { throw 'Desktop EXE was not built' }
      - name: Verify bundled native assets without GUI interaction
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/CodingBrainDesktop/CodingBrainDesktop.exe').Path -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Native self-test returned $($p.ExitCode)" }
      - name: Bundle the engine release files from this commit into the installer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check packaging
          python scripts/build_release.py --out dist/engine-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Engine bundle build failed' }
          Get-Content dist/engine-bundle/SHA256SUMS | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            if ((Get-FileHash -Algorithm SHA256 (Join-Path dist/engine-bundle $name)).Hash.ToLower() -ne $hash) { throw "bundle checksum: $name" }
          }
      - name: Build self-contained Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Unable to obtain the official Inno Setup compiler' }
            $iscc = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler is missing' }
          & $iscc 'installer/windows/CodingBrainDesktop.iss'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/CodingBrain-Setup.exe')) {
            throw 'Windows installer build failed'
          }
      - name: Verify installer installs, runs native self-test and uninstalls
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'CodingBrainDesktopInstallerTest'
          $exe = (Resolve-Path 'dist/CodingBrain-Setup.exe').Path
          $install = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR=' + $dir)) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with code $($install.ExitCode)" }
          $app = Join-Path $dir 'CodingBrainDesktop.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw 'Installer did not install the desktop executable' }
          foreach ($name in @('release.json', 'SHA256SUMS', 'install.ps1', 'Setup-CodingBrain.ps1', 'Verify-CodingBrainEngine.py', 'Setup-CodingBrain.cmd')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir "engine\$name"))) { throw "Installer did not deliver engine\$name" }
          }
          $probe = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($probe.ExitCode -ne 0) { throw "Installed desktop self-test failed with code $($probe.ExitCode)" }
          $uninstall = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstall)) { throw 'Installer did not create an uninstaller' }
          $remove = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with code $($remove.ExitCode)" }
      - name: Checksum installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 'dist/CodingBrain-Setup.exe').Hash.ToLowerInvariant()
          "$hash  CodingBrain-Setup.exe" | Set-Content -Encoding ascii 'dist/CodingBrain-Setup.exe.sha256'
      - name: Package portable Windows application and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/CodingBrainDesktop' -DestinationPath 'dist/CodingBrainDesktop-Windows.zip'
          $hash = (Get-FileHash -Algorithm SHA256 'dist/CodingBrainDesktop-Windows.zip').Hash.ToLowerInvariant()
          "$hash  CodingBrainDesktop-Windows.zip" | Set-Content -Encoding ascii 'dist/CodingBrainDesktop-Windows.zip.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: CodingBrainDesktop-Windows
          path: |
            dist/CodingBrainDesktop-Windows.zip
            dist/CodingBrainDesktop-Windows.zip.sha256
            dist/CodingBrain-Setup.exe
            dist/CodingBrain-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright for real UI interaction
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - name: Test desktop layout and interactions in Chromium
        env:
          CB_DESKTOP_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Workspace.png
        run: python tests/smoke_browser.py
      - name: Verify asynchronous loading feedback, retries and duplicate-action guards
        env:
          CB_DESKTOP_LOADING_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Loading.png
        run: python tests/smoke_loading_browser.py
      - name: Verify Git history and branch indicators automatically refresh
        env:
          CB_DESKTOP_GIT_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Git.png
        run: python tests/smoke_git_browser.py
      - name: Verify chat waits for installed engine and never fakes legacy replies
        run: python tests/smoke_chat_gate_browser.py
      - name: Verify app-native confirmations and v0.9.0 diagnostic fallback
        run: python tests/smoke_confirm_browser.py
      - name: Verify engine/version/model readiness indicators with real Chromium
        env:
          CB_DESKTOP_ENGINE_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Engine-Status.png
        run: python tests/smoke_engine_status_browser.py
      - name: Verify real provider connection indicators and refresh
        env:
          CB_DESKTOP_PROVIDER_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Providers-Connected.png
        run: python tests/smoke_provider_browser.py
      - name: Verify agent flow ownership, progress, code display, attachments and reconnect
        env:
          CB_DESKTOP_FLOW_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Flow.png
        run: python tests/smoke_live_flow_browser.py
      - name: Verify streamed chat replies with engine steps
        run: python tests/smoke_stream_browser.py
      - name: Verify the project conversation, context bar and directing work from chat
        run: python tests/smoke_conversation_browser.py
      - name: Verify the display library (tables, charts, option cards, sources, actions) and its safety
        env:
          CB_DESKTOP_DISPLAY_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Display.png
        run: python tests/smoke_display_browser.py
      - name: Verify the bundled Monaco editor, save conflicts and side-by-side review on the real bridge
        shell: pwsh
        env:
          CB_DESKTOP_EDITOR_SCREENSHOT: ${{ runner.temp }}/CodingBrain-Desktop-Editor.png
        run: |
          python -m pip install --disable-pip-version-check uvicorn fastapi
          python scripts/fetch_monaco.py
          if ($LASTEXITCODE -ne 0) { throw 'Monaco editor fetch failed (pinned checksum)' }
          python tests/smoke_editor_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodingBrainDesktop-UI-Screenshots
          path: ${{ runner.temp }}/CodingBrain-Desktop-*.png
          if-no-files-found: error
          retention-days: 14
