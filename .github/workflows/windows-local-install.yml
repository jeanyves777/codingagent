name: Windows local install

on:
  pull_request:
    paths:
      - "brain/**"
      - "installer/**"
      - "scripts/build_release.py"
      - "pyproject.toml"
      - "tests/test_local.py"
      - ".github/workflows/windows-local-install.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.12"]
        shell: [powershell, pwsh]
        include:
          - { os: windows-2022, python: "3.11", shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}  # the shell under test; other steps pin pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests for the local installation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q -p no:cacheprovider tests/test_local.py
      - name: Build an older and a newer release
        shell: pwsh
        run: |
          python scripts/build_release.py --out dist/old --version 0.9.0
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          python scripts/build_release.py --out dist/new --version "$version.post1" --constraints dist/old/constraints.txt
      - name: Install, recognize, update, refuse bad updates, roll back, uninstall
        run: ./installer/windows/verify.ps1 -Old dist/old -New dist/new
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shell }}
          path: verify-report.json

  sandbox:
    # Windows runners cannot run Linux containers: the real Docker sandbox is exercised here, with a
    # project placed directly in a home folder that also holds Coding Brain's data.
    name: real Docker sandbox (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sandbox images
        run: |
          # Base images from Docker Hub's Google mirror, with retries: Docker Hub's token service
          # intermittently times out on hosted runners.
          for base in $(grep -h '^FROM' brain/local/assets/Dockerfile.sandbox brain/local/assets/Dockerfile.sandbox.node | awk '{print $2}' | sort -u); do
            for attempt in 1 2 3 4; do
              if docker pull "mirror.gcr.io/library/$base" && docker tag "mirror.gcr.io/library/$base" "$base"; then break; fi
              if docker pull "$base"; then break; fi
              [ "$attempt" = 4 ] && exit 1
              sleep $((2 ** attempt))
            done
          done
          docker build --pull=false -t coding-brain-sandbox:0.1 -f brain/local/assets/Dockerfile.sandbox brain/local/assets
          docker build --pull=false -t coding-brain-node-sandbox:0.1 -f brain/local/assets/Dockerfile.sandbox.node brain/local/assets
      - name: Local installation tests with the real sandbox
        env:
          CODINGBRAIN_TEST_DOCKER: "1"
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q -p no:cacheprovider -rs tests/test_local.py tests/test_brain.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, sandbox]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release assets (constraints resolved on Windows)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $tag) { throw "Tag $tag does not match pyproject version $version" }
          python scripts/build_release.py --out dist/release
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*.whl
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info = Get-Content -Raw dist/release/release.json | ConvertFrom-Json
          Set-Content -Path notes.md -Value $info.notes
          $flags = @()
          if ($info.channel -eq 'dev') { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release -File).FullName --title "Coding Brain $($info.version)" --notes-file notes.md --verify-tag @flags
