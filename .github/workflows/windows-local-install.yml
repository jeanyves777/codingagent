name: Windows local install

on:
  pull_request:
    paths:
      - "brain/**"
      - "installer/**"
      - "scripts/build_release.py"
      - "pyproject.toml"
      - "tests/test_local.py"
      - "tests/test_memory.py"
      - "tests/test_multimodal.py"
      - "tests/multimodal_fixtures.py"
      - "tests/test_activity.py"
      - "tests/test_installer.py"
      - "tests/installer_fakes.py"
      - "tests/test_new.py"
      - "tests/test_assistant.py"
      - ".github/workflows/windows-local-install.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.12"]
        shell: [powershell, pwsh]
        include:
          - { os: windows-2022, python: "3.11", shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}  # the shell under test; other steps pin pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tesseract OCR (real OCR tests on Windows)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          & 'C:\Program Files\Tesseract-OCR\tesseract.exe' --version
      - name: Unit tests for the local installation and multimodal features
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          $env:CODINGBRAIN_TRANSCRIPTS = "$PWD\transcripts\${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shell }}"
          python -m pytest -q -p no:cacheprovider -rs tests/test_local.py tests/test_memory.py tests/test_multimodal.py tests/test_activity.py tests/test_installer.py tests/test_new.py tests/test_assistant.py
          Get-ChildItem transcripts -Recurse -Filter run-*.txt | ForEach-Object { python scripts/render_transcript.py $_.FullName ($_.FullName -replace '\.txt$', '.png') "Windows, Python ${{ matrix.python }}, ${{ matrix.shell }}" }
      - name: Conversational assistant through a real Windows console pipe, from the home folder
        run: |
          # `codingbrain` started in C:\Users\<runner>, outside any repository, with no model on this
          # runner: greetings, the project registry, creation and fixes must route correctly, and no
          # conversation may create a task store.
          $env:CODINGBRAIN_HOME = Join-Path $env:RUNNER_TEMP 'cb-chat'
          $lines = @('hello', 'What projects am I working on?', 'Create a task management application', 'n',
                     'Fix the calculator bug', '/tasks', '/exit')
          Push-Location $HOME
          try { $output = ($lines -join "`n") | python -m brain.local 2>&1 | Out-String } finally { Pop-Location }
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "codingbrain exited $LASTEXITCODE" }
          foreach ($expected in @("Hello! I'm Coding Brain", 'No projects yet', 'sounds like a new application',
                                  'nothing was created', 'Which project do you mean', 'conversations are not tasks', 'Goodbye')) {
            if ($output -notmatch [regex]::Escape($expected)) { throw "missing: $expected" }
          }
          if (Get-ChildItem $env:CODINGBRAIN_HOME -Recurse -Filter brain.sqlite3 -ErrorAction SilentlyContinue) {
            throw 'a conversation created a task store'
          }
      - name: Installer on a real Windows runner (preflight, plan, readiness, winget package ids)
        shell: pwsh
        run: |
          # Real probes on this VM. GitHub's Windows runners have no nested virtualization, WSL 2 or
          # Linux containers, so WSL/Docker readiness here shows the not-ready path, never a success.
          if (Get-Command winget -ErrorAction SilentlyContinue) { $env:CODINGBRAIN_TEST_WINGET = '1' } else { Write-Host 'winget is not on this runner image: the package-id check is skipped' }
          python -m pytest -q -p no:cacheprovider -rs -s tests/test_installer.py -k real
          $env:CODINGBRAIN_HOME = Join-Path $env:RUNNER_TEMP 'cb-plan'
          python -m brain.local install --plan --full --plain 2>&1 | Tee-Object -FilePath install-plan.txt
          if ($LASTEXITCODE -ne 0) { throw "install --plan exited $LASTEXITCODE" }
          python -m brain.local doctor --json > doctor-readiness.json
          $report = Get-Content -Raw doctor-readiness.json | ConvertFrom-Json
          Write-Host ("readiness: {0} (reached {1})" -f $report.readiness.level, $report.readiness.reached)
          if (-not $report.readiness.level) { throw 'doctor --json has no readiness level' }
          if ((Get-Content -Raw install-plan.txt) -match 'definitely') { throw 'virtualization must never be reported as definitely disabled' }
      - name: Build an older and a newer release
        shell: pwsh
        run: |
          python scripts/build_release.py --out dist/old --version 0.9.0
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          python scripts/build_release.py --out dist/new --version "$version.post1" --constraints dist/old/constraints.txt
      - name: Install, recognize, update, refuse bad updates, roll back, uninstall
        run: ./installer/windows/verify.ps1 -Old dist/old -New dist/new
      - name: install.ps1 hands over to provisioning before the CLI is on PATH
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'cb-boot'
          $output = & ./installer/windows/install.ps1 -From dist/new -InstallDir $boot -Python (Get-Command python).Source -Yes -NoPath -Full -PlanOnly *>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Full -PlanOnly exited $LASTEXITCODE" }
          if ($output -notmatch 'Plan:' -or $output -notmatch 'Docker Desktop' -or $output -notmatch 'Readiness:') { throw 'the provisioning plan was not shown' }
          if (Get-Command codingbrain -ErrorAction SilentlyContinue) { Write-Host '(a codingbrain from an earlier step is on PATH; the plan above ran from the new venv)' }
      - name: Download the published v0.9.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.9.0 --repo "${{ github.repository }}" --dir dist/published-0.9.0
      - name: Upgrade from the published v0.9.0 release with codingbrain update
        run: ./installer/windows/verify-upgrade.ps1 -New dist/new -PublishedDir dist/published-0.9.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shell }}
          path: |
            verify-report.json
            upgrade-report.json
            install-plan.txt
            doctor-readiness.json
            transcripts/

  engines:
    # Real engines, no mocks: the whole test suite (gauntlet included) with Tesseract OCR, a
    # headless Chromium and an Ollama vision model receiving actual images.
    name: real OCR, browser and vision model (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODINGBRAIN_TEST_VISION_MODEL: qwen2.5vl:3b
      CODINGBRAIN_TEST_CODING_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract, Python packages and Chromium
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Install Ollama and pull the vision model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          sleep 5
          ollama pull "$CODINGBRAIN_TEST_VISION_MODEL"
          ollama pull "$CODINGBRAIN_TEST_CODING_MODEL"
          curl -s http://localhost:11434/api/show -d "{\"model\": \"$CODINGBRAIN_TEST_VISION_MODEL\"}" | python -c "import json, sys; print('capabilities:', json.load(sys.stdin).get('capabilities'))"
      - name: Full test suite with real engines
        shell: bash  # bash -eo pipefail: a failing pytest fails the step despite tee
        run: |
          # The benchmark isolation test needs mount namespaces (root); it runs in the next step.
          python -m pytest -q -p no:cacheprovider -rfs -s tests \
            --deselect tests/test_gauntlet.py::test_isolation_masks_outermost_roots_and_is_probed 2>&1 | tee engines-test.log
      - name: Benchmark isolation test (needs root for mount namespaces)
        run: sudo -E env "PATH=$PATH" python -m pytest -q -p no:cacheprovider -rfs tests/test_gauntlet.py::test_isolation_masks_outermost_roots_and_is_probed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engines-test-log
          path: |
            engines-test.log
            ollama.log

  sandbox:
    # Windows runners cannot run Linux containers: the real Docker sandbox is exercised here, with a
    # project placed directly in a home folder that also holds Coding Brain's data.
    name: real Docker sandbox (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sandbox images
        run: |
          # Base images from Docker Hub's Google mirror, with retries: Docker Hub's token service
          # intermittently times out on hosted runners.
          for base in $(grep -h '^FROM' brain/local/assets/Dockerfile.sandbox brain/local/assets/Dockerfile.sandbox.node | awk '{print $2}' | sort -u); do
            for attempt in 1 2 3 4; do
              if docker pull "mirror.gcr.io/library/$base" && docker tag "mirror.gcr.io/library/$base" "$base"; then break; fi
              if docker pull "$base"; then break; fi
              [ "$attempt" = 4 ] && exit 1
              sleep $((2 ** attempt))
            done
          done
          docker build --pull=false -t coding-brain-sandbox:0.1 -f brain/local/assets/Dockerfile.sandbox brain/local/assets
          docker build --pull=false -t coding-brain-node-sandbox:0.1 -f brain/local/assets/Dockerfile.sandbox.node brain/local/assets
      - name: Local installation tests with the real sandbox
        env:
          CODINGBRAIN_TEST_DOCKER: "1"
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q -p no:cacheprovider -rs tests/test_local.py tests/test_brain.py

  installer-e2e:
    # Real, unmocked: `codingbrain install --profile local` on a Linux runner with a real Ollama and
    # model (the generation test proves it runs), `doctor --full` with real sandbox images, and the
    # disposable end-to-end task (real model fixes a real bug, tests run in the real sandbox).
    name: real installer readiness and end-to-end task (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODINGBRAIN_TEST_CODING_MODEL: qwen2.5-coder:7b
      CODINGBRAIN_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox images, Ollama and the coding model
        run: |
          for base in $(grep -h '^FROM' brain/local/assets/Dockerfile.sandbox brain/local/assets/Dockerfile.sandbox.node | awk '{print $2}' | sort -u); do
            for attempt in 1 2 3 4; do
              if docker pull "mirror.gcr.io/library/$base" && docker tag "mirror.gcr.io/library/$base" "$base"; then break; fi
              if docker pull "$base"; then break; fi
              [ "$attempt" = 4 ] && exit 1
              sleep $((2 ** attempt))
            done
          done
          python -m pip install --disable-pip-version-check -e ".[dev]"
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          sleep 5
      - name: codingbrain install --profile local (real; downloads the model through Ollama)
        shell: bash
        run: |
          export CODINGBRAIN_HOME="$RUNNER_TEMP/cb-real"
          python -m brain.local setup --non-interactive --model "$CODINGBRAIN_TEST_CODING_MODEL"
          python -m brain.local install --profile local --yes --plain 2>&1 | tee install-local.txt
          grep -q "Readiness: Core ready" install-local.txt
      - name: doctor --full (real generation, real sandbox start)
        shell: bash
        run: |
          export CODINGBRAIN_HOME="$RUNNER_TEMP/cb-real"
          python -m brain.local install --only sandbox --profile full --yes --plain 2>&1 | tee install-sandbox.txt
          python -m brain.local doctor --full --json > doctor-full.json
          python - <<'PY'
          import json
          report = json.load(open("doctor-full.json"))["readiness"]
          print("level:", report["level"], "reached:", report["reached"])
          assert report["levels"]["core"]["ready"] and report["levels"]["sandbox"]["ready"], report
          assert report["components"]["model"]["verified"], report["components"]["model"]
          assert report["components"]["sandbox"]["verified"], report["components"]["sandbox"]
          PY
      - name: Real model and end-to-end tests (merge gate - Coding Brain's own guarantees)
        shell: bash
        env:
          CODINGBRAIN_CAPABILITY_REPORT: ${{ github.workspace }}/goal-first-capability.json
        run: python -m pytest -q -p no:cacheprovider -rs -s tests/test_installer.py tests/test_new.py -k real 2>&1 | tee installer-real.log
      - name: Real-model goal-first capability (reported, not a merge gate; required before production-ready)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          path = "goal-first-capability.json"
          if not os.path.exists(path):
              print("::warning::No capability report: the real goal-first build did not run to completion")
              sys.exit(1)
          report = json.load(open(path))
          verdict = "SUCCEEDED" if report["passed"] else "FAILED"
          lines = [f"### Real-model goal-first build: {verdict}", "",
                   f"Model `{report['model']}`, status `{report['status']}`, {report['attempts']} test run(s), "
                   f"{report['seconds']} s, supervisor used: {report['supervisor_used']}.", "",
                   "Not a merge gate. Goal-first building is not production-ready until this succeeds reliably.", ""]
          lines += [f"- {item['category']}" + (f" (diagnosis: {item['diagnosis']})" if item.get("diagnosis") else "")
                    + f": {str(item.get('summary') or '')[:160]}" for item in report["failures"]]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not report["passed"]:
              print(f"::warning::Real-model goal-first build {verdict.lower()} ({report['status']}); see the job summary")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-real
          path: |
            install-local.txt
            install-sandbox.txt
            doctor-full.json
            installer-real.log
            goal-first-capability.json
            ollama.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, engines, sandbox, installer-e2e]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release assets (constraints resolved on Windows)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $tag) { throw "Tag $tag does not match pyproject version $version" }
          python scripts/build_release.py --out dist/release
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*.whl
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info = Get-Content -Raw dist/release/release.json | ConvertFrom-Json
          Set-Content -Path notes.md -Value $info.notes
          $flags = @()
          if ($info.channel -eq 'dev') { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release -File).FullName --title "Coding Brain $($info.version)" --notes-file notes.md --verify-tag @flags
